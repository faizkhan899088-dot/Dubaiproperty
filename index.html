<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai Investment Opportunities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f4e9d8, #d4a373);
            color: #333;
            line-height: 1.6;
        }

        header {
            background: url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .header-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .cta-button {
            background: #d4a373;
            color: white;
            padding: 0.8rem 2rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .cta-button:hover {
            background: #b8860b;
        }

        .form-section {
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4a373;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #d4a373;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #b8860b;
        }

        .success-message {
            display: none;
            text-align: center;
            color: #27ae60;
            font-weight: bold;
            margin-top: 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #2c3e50;
            color: white;
        }

        @media (max-width: 768px) {
            .header-content h1 {
                font-size: 2rem;
            }

            .header-content p {
                font-size: 1rem;
            }

            .form-section {
                margin: 1rem;
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Invest in Dubai's Future</h1>
            <p>Unlock exclusive investment opportunities in the heart of luxury and innovation.</p>
            <a href="#investment-form" class="cta-button">Get Started</a>
        </div>
    </header>

    <section class="form-section" id="investment-form">
        <h2>Connect with Our Investment Team</h2>
        <form id="investmentForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="investment-type">Investment Interest</label>
                <select id="investment-type" name="investment-type" required>
                    <option value="" disabled selected>Select an option</option>
                    <option value="real-estate">Real Estate</option>
                    <option value="business">Business Ventures</option>
                    <option value="stocks">Stocks & Bonds</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <button type="submit">Submit</button>
            <p class="success-message" id="successMessage">Thank you! Our team will contact you soon.</p>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Dubai Investment Group. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('investmentForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Basic form validation
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const investmentType = document.getElementById('investment-type').value;

            if (name && email && phone && investmentType) {
                // Simulate form submission (in a real scenario, send data to a server)
                document.getElementById('successMessage').style.display = 'block';
                this.reset(); // Clear the form
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 3000); // Hide success message after 3 seconds
            }
        });
    </script>
</body>
</html>
